<!--
  plaiiinlight-command — sends power/color/brightness/mode/effect commands
  to a single lamp over a plaiiinlight-config node's shared MQTT connection.

  The editor-side JS here never talks MQTT directly. The one bit of runtime
  interaction it does is fetching the live lamp list from the config node's
  `/plaiiinlight/:id/lamps` admin endpoint (registered in src/config.ts) to
  populate the lamp datalist — manual entry is always still allowed, since a
  lamp may not have announced itself yet when the flow is being edited.
-->
<script type="text/html" data-template-name="plaiiinlight-command">
    <div class="form-row">
        <label for="node-input-config"><i class="fa fa-server"></i> Config</label>
        <input type="text" id="node-input-config">
    </div>
    <div class="form-row">
        <label for="node-input-lamp"><i class="fa fa-lightbulb-o"></i> Lamp</label>
        <input type="text" id="node-input-lamp" list="node-input-lamp-list" placeholder="tower8">
        <datalist id="node-input-lamp-list"></datalist>
    </div>
    <div class="form-row">
        <label for="node-input-action"><i class="fa fa-bolt"></i> Action</label>
        <select id="node-input-action" style="width: 70%">
            <option value="power">Power</option>
            <option value="color">Color</option>
            <option value="brightness">Brightness</option>
            <option value="mode">Mode</option>
            <option value="effect-next">Next effect</option>
            <option value="effect-prev">Previous effect</option>
        </select>
    </div>
    <div class="form-row" id="plaiiinlight-command-row-usepayload">
        <input type="checkbox" id="node-input-usePayload" style="display: inline-block; width: auto; vertical-align: top;">
        <label for="node-input-usePayload" style="width: 70%;">Use msg.payload for value</label>
    </div>
    <div class="form-row" id="plaiiinlight-command-row-value">
        <label for="node-input-value"><i class="fa fa-pencil"></i> Value</label>
        <input type="text" id="node-input-value" placeholder="value">
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
</script>

<script type="text/html" data-help-name="plaiiinlight-command">
    <p>Sends a single power/color/brightness/mode/effect command to one lamp, over the shared MQTT
    connection owned by a <code>plaiiinlight-config</code> node.</p>
    <h3>Details</h3>
    <dl class="message-properties">
        <dt>lamp</dt>
        <dd>the target lamp's MQTT node name (e.g. <code>tower8</code>). Pick from the dropdown of
        lamps the config node has already discovered, or type one in manually.</dd>
        <dt>action</dt>
        <dd><code>power</code> | <code>color</code> | <code>brightness</code> | <code>mode</code> |
        <code>effect-next</code> | <code>effect-prev</code>. Determines both the MQTT topic suffix
        published to and how the value is mapped to the wire payload (see payload.ts).
        <code>effect-next</code>/<code>effect-prev</code> take no value.</dd>
        <dt>value</dt>
        <dd>a static value to send, used unless "use msg.payload" is checked.</dd>
        <dt>use msg.payload</dt>
        <dd>when checked, the value comes from the incoming message's <code>msg.payload</code>
        instead of the static value field.</dd>
    </dl>
    <h3>Status</h3>
    <p>Green dot: command published. Red dot: the value failed to map to a valid payload (nothing
    was published). Red ring: the node isn't configured (missing config node or lamp).</p>
</script>

<script type="text/javascript">
    RED.nodes.registerType('plaiiinlight-command', {
        category: 'PlaiiinLightOS',
        defaults: {
            name: { value: '' },
            config: { value: '', type: 'plaiiinlight-config', required: true },
            lamp: { value: '', required: true },
            action: { value: 'power', required: true },
            value: { value: '' },
            usePayload: { value: false }
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-bolt',
        label: function () {
            return this.name || (this.lamp ? `${this.lamp}: ${this.action}` : 'plaiiinlight-command');
        },
        oneditprepare: function () {
            const node = this;

            function populateLamps(configId) {
                const $datalist = $('#node-input-lamp-list');
                $datalist.empty();
                if (!configId) return;
                $.getJSON('plaiiinlight/' + configId + '/lamps', function (lamps) {
                    (lamps || []).forEach(function (lamp) {
                        $('<option>').val(lamp.node).appendTo($datalist);
                    });
                });
            }

            populateLamps(node.config);
            $('#node-input-config').on('change', function () {
                populateLamps($(this).val());
            });

            function updateValueVisibility() {
                const action = $('#node-input-action').val();
                const noValue = action === 'effect-next' || action === 'effect-prev';
                $('#plaiiinlight-command-row-usepayload').toggle(!noValue);
                const usePayload = $('#node-input-usePayload').is(':checked');
                $('#plaiiinlight-command-row-value').toggle(!noValue && !usePayload);
            }

            $('#node-input-action').on('change', updateValueVisibility);
            $('#node-input-usePayload').on('change', updateValueVisibility);
            updateValueVisibility();
        }
    });
</script>
