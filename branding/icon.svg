<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="PlaiiinLight — LED lamp tower">
  <defs>
    <!-- Vertical brand gradient (violet → fuchsia → pink → amber), spanning the
         lamp so top rows read purple and the base reads orange. userSpaceOnUse
         keeps it continuous across every dot rather than per-circle. -->
    <linearGradient id="lamp" x1="48" y1="16" x2="48" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.28" stop-color="#d946ef"/>
      <stop offset="0.5" stop-color="#ec4899"/>
      <stop offset="0.72" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded-square field, matching homebridge/branding/icon.png -->
  <rect width="96" height="96" rx="20" fill="#1a1a1a"/>

  <!-- Lamp top -->
  <ellipse cx="48" cy="23" rx="20" ry="5.5" fill="url(#lamp)"/>

  <!-- 4 columns × 5 rows of LEDs -->
  <g fill="url(#lamp)">
    <circle cx="33" cy="33" r="4.1"/><circle cx="43.7" cy="33" r="4.1"/><circle cx="54.3" cy="33" r="4.1"/><circle cx="65" cy="33" r="4.1"/>
    <circle cx="33" cy="43" r="4.1"/><circle cx="43.7" cy="43" r="4.1"/><circle cx="54.3" cy="43" r="4.1"/><circle cx="65" cy="43" r="4.1"/>
    <circle cx="33" cy="53" r="4.1"/><circle cx="43.7" cy="53" r="4.1"/><circle cx="54.3" cy="53" r="4.1"/><circle cx="65" cy="53" r="4.1"/>
    <circle cx="33" cy="63" r="4.1"/><circle cx="43.7" cy="63" r="4.1"/><circle cx="54.3" cy="63" r="4.1"/><circle cx="65" cy="63" r="4.1"/>
    <circle cx="33" cy="73" r="4.1"/><circle cx="43.7" cy="73" r="4.1"/><circle cx="54.3" cy="73" r="4.1"/><circle cx="65" cy="73" r="4.1"/>
  </g>

  <!-- Lamp base -->
  <path d="M30 81 Q48 90 66 81" fill="none" stroke="#f59e0b" stroke-width="5.5" stroke-linecap="round"/>
</svg>
